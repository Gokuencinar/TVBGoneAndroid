name: Build Android APK

on:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "scripts/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android.yml"
  pull_request:
    branches:
      - main
    paths:
      - "app/**"
      - "scripts/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Generate expanded IR database
        shell: bash
        run: |
          set -euxo pipefail

          COMMUNITY_SHA="d126fb1b6f1e114c52b4a8c19839ea65e3a9c24d"
          OFFICIAL_SHA="f7b15366521cc81ba11b341538f0097bddbb748b"

          COMMUNITY_DIR="$RUNNER_TEMP/flipper-community"
          OFFICIAL_DIR="$RUNNER_TEMP/flipper-official"

          git init "$COMMUNITY_DIR"
          git -C "$COMMUNITY_DIR" remote add origin https://github.com/Lucaslhm/Flipper-IRDB.git
          git -C "$COMMUNITY_DIR" fetch --depth 1 origin "$COMMUNITY_SHA"
          git -C "$COMMUNITY_DIR" checkout --detach FETCH_HEAD

          git init "$OFFICIAL_DIR"
          git -C "$OFFICIAL_DIR" remote add origin https://github.com/flipperdevices/IRDB.git
          git -C "$OFFICIAL_DIR" fetch --depth 1 origin "$OFFICIAL_SHA"
          git -C "$OFFICIAL_DIR" checkout --detach FETCH_HEAD

          python3 scripts/generate_extended_ir_database.py             "$COMMUNITY_DIR"             "$OFFICIAL_DIR"             app/src/main/java/com/gokuencinar/iruniversal/ir/GeneratedExtendedIrDatabase.kt

      - name: Assemble debug APK
        run: gradle --stacktrace :app:assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TVBGoneAndroid-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Create GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: TVBGoneAndroid build ${{ github.run_number }}
          files: app/build/outputs/apk/debug/app-debug.apk
          generate_release_notes: false
