name: Build Android APK

on:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "scripts/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android.yml"
  pull_request:
    branches:
      - main
    paths:
      - "app/**"
      - "scripts/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Generate expanded IR database
        shell: bash
        run: |
          set -euxo pipefail

          COMMUNITY_SHA="d126fb1b6f1e114c52b4a8c19839ea65e3a9c24d"
          OFFICIAL_SHA="f7b15366521cc81ba11b341538f0097bddbb748b"

          COMMUNITY_DIR="$RUNNER_TEMP/flipper-community"
          OFFICIAL_DIR="$RUNNER_TEMP/flipper-official"

          git init "$COMMUNITY_DIR"
          git -C "$COMMUNITY_DIR" remote add origin https://github.com/Lucaslhm/Flipper-IRDB.git
          git -C "$COMMUNITY_DIR" fetch --depth 1 origin "$COMMUNITY_SHA"
          git -C "$COMMUNITY_DIR" checkout --detach FETCH_HEAD

          git init "$OFFICIAL_DIR"
          git -C "$OFFICIAL_DIR" remote add origin https://github.com/flipperdevices/IRDB.git
          git -C "$OFFICIAL_DIR" fetch --depth 1 origin "$OFFICIAL_SHA"
          git -C "$OFFICIAL_DIR" checkout --detach FETCH_HEAD

          python3 scripts/generate_extended_ir_database.py             "$COMMUNITY_DIR"             "$OFFICIAL_DIR"             app/src/main/java/com/gokuencinar/iruniversal/ir/GeneratedExtendedIrDatabase.kt

      - name: Assemble debug APK for pull requests
        if: github.event_name == 'pull_request'
        run: gradle --stacktrace :app:assembleDebug

      - name: Restore permanent signing key
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          if [[ -z "${KEYSTORE_BASE64}" ]]; then
            echo "::error::ANDROID_SIGNING_KEYSTORE_BASE64 is not configured."
            exit 1
          fi

          KEYSTORE_PATH="$RUNNER_TEMP/tvbgone-release.p12"
          printf '%s' "${KEYSTORE_BASE64}" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"

      - name: Assemble signed release APK
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          ANDROID_SIGNING_STORE_FILE: ${{ runner.temp }}/tvbgone-release.p12
          ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [[ -z "${ANDROID_SIGNING_STORE_PASSWORD}" || -z "${ANDROID_SIGNING_KEY_ALIAS}" || -z "${ANDROID_SIGNING_KEY_PASSWORD}" ]]; then
            echo "::error::Permanent Android signing secrets are not fully configured."
            exit 1
          fi

          gradle --stacktrace :app:assembleRelease

      - name: Prepare distributable APK
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p dist

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            cp app/build/outputs/apk/debug/app-debug.apk dist/TVBGoneAndroid.apk
          else
            cp app/build/outputs/apk/release/app-release.apk dist/TVBGoneAndroid.apk
          fi

      - name: Verify release signature
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          if [[ -z "$APKSIGNER" ]]; then
            echo "::error::apksigner not found in Android SDK"
            exit 1
          fi
          "$APKSIGNER" verify --verbose --print-certs dist/TVBGoneAndroid.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TVBGoneAndroid
          path: dist/TVBGoneAndroid.apk

      - name: Create GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: TVBGoneAndroid build ${{ github.run_number }}
          files: dist/TVBGoneAndroid.apk
          generate_release_notes: false
