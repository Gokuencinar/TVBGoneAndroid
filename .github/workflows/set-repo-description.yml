name: Set repository description

on:
  push:
    paths:
      - ".github/workflows/set-repo-description.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Set repository description
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}" \
            -f description="TVBGoneAndroid — app Android para controlar dispositivos IR mediante blaster integrado o adaptador IR por audio. Compatible con Android 11+."
